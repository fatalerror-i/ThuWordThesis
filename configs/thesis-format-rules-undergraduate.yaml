# -----------------------------------------------------------------------------
# 4.11 代码样式
# 包含：inlineCode、blockCode
# -----------------------------------------------------------------------------

  # 行内代码（Word 样式：行内代码）（字符样式）
  # 指南：自定｜用途：正文中的命令、变量、短代码
  # 备注：仿宋 + Consolas；字符样式，不参与段落格式
  inlineCode:
    styleType: character  # 样式类型（w:type）
    characterFormat:  # 字符格式（Word: w:rPr）
      fontFamily:  # 字体（Word: w:rFonts）
        chinese: FangSong  # 中文字体（w:eastAsia）：仿宋
        western: Consolas  # 西文字体（w:ascii）：Consolas

  # 行间代码（Word 样式：行间代码）
  # 指南：自定｜用途：独立成段的代码块
  # 备注：仿宋 + Consolas；单倍行距；数字行号；左对齐；不自动调整中西文间距
  blockCode:
    characterFormat:  # 字符格式（Word: w:rPr）
      fontFamily:  # 字体（Word: w:rFonts）
        chinese: FangSong  # 中文字体（w:eastAsia）：仿宋
        western: Consolas  # 西文字体（w:ascii）：Consolas
    paragraphFormat:  # 段落格式（Word: w:pPr）
      wordWrap: false  # 不允许西文在单词中间换行
      hyphenation: false  # 本样式不参与自动断字
      alignment: left  # 对齐（w:jc）：左对齐
      lineSpacing:  # 行距（w:spacing）
        rule: single  # 单倍行距
      spaceBefore: {value: 0, unit: pt}  # 段前 0
      spaceAfter: {value: 0, unit: pt}  # 段后 0
      numbering: {list: codeLines, level: 1}  # 行号
      autoSpaceDE: false  # 不自动调整西文与中文间距
      autoSpaceDN: false  # 不自动调整数字与中文间距


# =============================================================================
# 5. numbering — 编号
# =============================================================================
numbering:
  lists:
    outline:  # 正文标题编号（章/节共用同一列表）
      levels:
        1: {format: decimal, text: "第%1章　", suffix: none, start: 1}  # 第1章
        2: {format: decimal, text: "%1.%2　", suffix: none, start: 1}
        3: {format: decimal, text: "%1.%2.%3　", suffix: none, start: 1}
        4: {format: decimal, text: "%1.%2.%3.%4　", suffix: none, start: 1}
    appendix:  # 附录编号
      levels:
        1: {format: upperLetter, text: "附录%1　", suffix: none, start: 1}
        2: {format: decimal, text: "%1.%2　", suffix: none, start: 1}
        3: {format: decimal, text: "%1.%2.%3　", suffix: none, start: 1}
        4: {format: decimal, text: "%1.%2.%3.%4　", suffix: none, start: 1}
    references:  # 参考文献编号
      levels:
        1: {format: decimal, text: "[%1]", suffix: tab, start: 1}
    achievements:  # 个人成果编号（与参考文献独立，从 1 开始）
      levels:
        1: {format: decimal, text: "[%1]", suffix: tab, start: 1}
    appendixReferences:  # 附录参考文献编号
      levels:
        1: {format: decimal, text: "[%1]", suffix: tab, start: 1}
    codeLines:  # 行间代码行号
      levels:
        1: {format: decimal, text: "%1", suffix: tab, start: 1}
    listNumber1:  # 有序列表：1.
      levels:
        1: {format: decimal, text: "%1.", suffix: tab, start: 1}
    listNumber2:  # 有序列表：(1)
      levels:
        1: {format: decimal, text: "(%1)", suffix: tab, start: 1}
    listNumber3:  # 有序列表：a.
      levels:
        1: {format: lowerLetter, text: "%1.", suffix: tab, start: 1}
    listBullet1:  # 无序列表：黑色实心圆点
      levels:
        1: {format: bullet, text: "•", suffix: tab, start: 1, font: Times New Roman}
    listBullet2:  # 无序列表：黑色空心圆点
      levels:
        1: {format: bullet, text: "◦", suffix: tab, start: 1, font: Times New Roman}
    listBullet3:  # 无序列表：星号
      levels:
        1: {format: bullet, text: "*", suffix: tab, start: 1, font: Times New Roman}

# =============================================================================
# 6. captions — 题注
# =============================================================================
captions:
  defaults:  # 题注标签/编号/题名间距
    labelGap: ""  # 标签与编号之间（无空格）
    titleGap: "　"  # 编号与题名之间（全角空格）
  equation:  # 正文公式编号（公式居中，编号右行末）
    # 括号采用半角：与 Word 域、公式宏的 #() 写法一致；《指南》2.3.19 半角/全角均合法。
    numberSource: 'STYLEREF 1 \s'  # 章号来源
    separator: "."
    field: 'SEQ 式 \* ARABIC \s 1'
    prefix: "("
    suffix: ")"
    position: right
  figure:  # 图注
    label: "图"
    field: 'SEQ 图 \* ARABIC \s 1'
    position: below
  table:  # 表注
    label: "表"
    field: 'SEQ 表 \* ARABIC \s 1'
    position: above
  subfigure:  # 子图题注
    pattern: "({letter})"
    position: below
  appendixFigure:  # 附录图题注（官方示例 图A.1）
    label: "图"
    letterSource: 'STYLEREF 附录标题 1'  # 附录字母来源（“附录A”）
    separator: "."
    field: 'SEQ 图 \* ARABIC \s 1'  # 附录内图序号，按附录重置
  appendixTable:  # 附录表题注（官方示例 表A.1）
    label: "表"
    letterSource: 'STYLEREF 附录标题 1'  # 附录字母来源（“附录A”）
    separator: "."
    field: 'SEQ 表 \* ARABIC \s 1'  # 附录内表序号，按附录重置
  appendixEquation:  # 附录公式编号（官方示例 (A.1)）
    letterSource: 'STYLEREF 附录标题 1'  # 附录字母来源（“附录A”）
    separator: "."
    field: 'SEQ 式 \* ARABIC \s 1'  # 附录内公式序号，按附录重置
    prefix: "("
    suffix: ")"
  continuedTable:  # 续表题注
    prefix: ""
    suffix: "（续）"
    repeatHeader: true
  englishFigure:  # 英文图题注（自定）
    label: Figure
  englishTable:  # 英文表题注（自定）
    label: Table

# =============================================================================
# 7. tables — 表格
# =============================================================================
tables:
  default: threeLine  # 默认表格样式
  captionStyle: tableCaption  # 表注样式（表上方）
  noteStyle: figureTableNote  # 图表附注样式（图/表下方）
  threeLine:  # 三线表（指南 2.3.19）
    style: threeLineTable  # 对应 Word 表格样式（三线表）
    tableBorders:
      top: {style: single, width: {value: 1.5, unit: pt}}
      bottom: {style: single, width: {value: 1.5, unit: pt}}
      left: {style: none}
      right: {style: none}
      insideHorizontal: {style: none}
      insideVertical: {style: none}
    firstRowBorders:  # 首行条件边框（w:tblStylePr type=firstRow）
      bottom: {style: single, width: {value: 1, unit: pt}}
    alignment: center  # 表格居中
    auxiliaryLines: allowed  # 必要时可加辅助线（指南 2.3.19）
    headerRow:
      repeatOnNewPage: true  # 跨页时重复表头行
  cellText:  # 表格单元格文字
    style: tableText  # 唯一定义在 styles.tableText（表格文字）；这里只声明引用
  imageContainer:  # 图片容器表（自定）
    tableBorders:
      top: {style: none}
      bottom: {style: none}
      left: {style: none}
      right: {style: none}
      insideHorizontal: {style: none}
      insideVertical: {style: none}

# =============================================================================
# 8. footnotes — 脚注
# =============================================================================
footnotes:
  text: {style: footnoteText}  # 脚注文本样式
  numbering: {format: circledDecimal, restart: eachPage}  # ①②③，每页重编
  referenceMarker: superscript  # 正文中脚注序号为上标
  textMarker: normal  # 脚注文本中的编号为普通文本

# =============================================================================
# 9. headersAndFooters — 页眉页脚与页码
# =============================================================================
headersAndFooters:
  header:
    content: none  # 本科规范：页眉无（全篇不留页眉）
    style: none
  pageNumber:
    style: footer
    position: footerCenter
    frontMatterFormat: upperRoman  # 摘要至符号说明
    bodyFormat: decimal  # 正文至末

# =============================================================================
# 10. cover — 封面
# =============================================================================
cover:
  chinese:
    title: {style: coverTitleChinese}  # 论文题目（必填）
    degreeInfo: {style: coverDegreeInfo}  # 学位类别/学科门类（必填）
    authorInfo:  # 培养单位/学科/作者/导师（必填）
      style: coverAuthorInfo
      colonCentered: true  # 作者信息以冒号为中心对齐
      colonCenter: {value: 259.2, unit: pt}  # 冒号中心距页面左边缘
      labelAlignment: right  # 冒号左侧标签右对齐
      valueAlignment: left  # 冒号右侧内容左对齐
      labelRightTab: {value: 184.5, unit: pt}  # 表格加宽后保持作者信息的水平位置
      valueLeftTab: {value: 189.5, unit: pt}
    date: {style: coverDate, source: fixedText}  # 成文日期（必填，固定文本）
    securityLevel: {style: coverSecurity}  # 表格首行密级控件（可选；默认空白）
    layout:  # 中文封面整页固定表格（无框线；行高单位 pt）
      type: fixedTable
      width: {value: 14.8, unit: cm}  # 与版心一致：21 - 3 - 3 - 0.2cm 装订线
      topSpace: {value: 21, unit: pt}  # logo 段前留白，计入第一行高度；参考 ThuThesis 的 21bp
      rows:  # 自上而下；作者与日期位置按官方本科示例校准
        - {role: security, height: {value: 18.2, unit: pt}}  # 四号黑体单倍行距一行，段前后为 0
        - {role: logo, height: {value: 101, unit: pt}}  # 21pt 段前 + 80pt logo 行
        - {role: spacer, height: {value: 18, unit: pt}}
        - {role: trainingTitle, height: {value: 50, unit: pt}}
        - {role: spacer, height: {value: 26, unit: pt}}
        - {role: title, height: {value: 136, unit: pt}}  # 参考 ThuThesis 的 136bp 题目区
        - {role: spacer, height: {value: 16.5, unit: pt}}
        - {role: authorInfo, height: {value: 156, unit: pt}}  # 6 段 × 26pt
        - {role: spacer, height: {value: 47.3, unit: pt}}  # 缩短一行（18.2pt），使日期保持原位
        - {role: date, height: {value: 40, unit: pt}}

# =============================================================================
# 11. documentParts — 论文各部分
# =============================================================================
documentParts:
  authorization:  # 授权说明
    heading: {style: authorizationTitle}
    body: {style: authorizationText}
  abstract:  # 摘要
    heading: {style: chapterTitleUnnumbered}
    body: {style: body}
  abstractEnglish:  # Abstract
    heading: {style: chapterTitleUnnumbered}
    body: {style: body}
  tableOfContents: {heading: {style: chapterTitleUnnumbered, outlineLevel: bodyText}, levels: 3}  # 目录从正文收录
  listOfFigures: {heading: {style: chapterTitleUnnumbered}}  # 插图清单
  listOfTables: {heading: {style: chapterTitleUnnumbered}}  # 附表清单
  symbols: {heading: {style: chapterTitleUnnumbered}}  # 符号和缩略语说明
  references: {heading: {style: chapterTitleUnnumbered}}  # 参考文献
  appendix:
    heading: {style: appendixTitle}  # 附录A
    sectionLevel1: {style: appendixSectionTitle1}
  acknowledgements: {heading: {style: chapterTitleUnnumbered}}  # 致谢
  declaration: {heading: {style: chapterTitleUnnumbered}}  # 声明
  researchAchievements:  # 在学期间参加课题的研究成果：学术论文/专著译著/专利/作品/研究报告/其他
    heading: {style: chapterTitleUnnumbered}
    sectionStyle: sectionTitleUnnumbered
  appendixReferences: {heading: {style: sectionTitleUnnumbered}}  # 附录内参考文献小节（无编号、无大纲、居中）

# =============================================================================
# 12. appendix — 纯注释
# =============================================================================
# 12.1 Word XML 对照
#   paragraphFormat ≈ w:pPr；characterFormat ≈ w:rPr
#   alignment ≈ w:jc；lineSpacing ≈ w:spacing/@w:line + @w:lineRule
#   pageMargins ≈ w:pgMar；numbering ≈ w:numPr；tableBorders ≈ w:tblBorders
#   fontSize ≈ w:sz；outlineLevel ≈ w:outlineLvl（规则 1 起，XML 0 起）
